name: Build packages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A newer commit's test run supersedes an older one outright — cancel it,
    # nothing here touches shared state so there's nothing to leave half-done.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          chmod +x scripts/version.sh
          V="$(./scripts/version.sh)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Package version: $V"

  build:
    name: ${{ matrix.arch }} (${{ matrix.format }})
    needs: [test, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same reasoning as the test job: this is the expensive, multi-arch stage,
    # and cancelling it for a stale commit is pure savings — release/commit-dist
    # both require build to succeed, so cancelling it here also stops the old
    # run from ever reaching the git-push stage below.
    # Group is per-arch: matrix legs of the *same* run must stay parallel,
    # only the same leg across two different runs should race/cancel.
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.arch }}-${{ matrix.format }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_generic
          - arm_cortex-a7_neon-vfpv4
          - mipsel_24kc
          - x86_64
        format:
          - ipk
          - apk
        include:
          - format: ipk
            openwrt: 24.10.5
          - format: apk
            openwrt: 25.12.3

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.format }} (${{ matrix.arch }}, OpenWrt ${{ matrix.openwrt }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-ipk
          tags: lst-signbox-lists-tgbot-${{ matrix.format }}:${{ matrix.arch }}
          build-args: |
            ARCH=${{ matrix.arch }}
            OPENWRT_VERSION=${{ matrix.openwrt }}
            LISTS_TG_VERSION=${{ needs.version.outputs.version }}
            LISTS_TG_RELEASE=1
          load: true
          cache-from: type=gha,scope=${{ matrix.format }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.format }}-${{ matrix.arch }}

      - name: Extract ${{ matrix.format }} files
        env:
          ARCH: ${{ matrix.arch }}
          FORMAT: ${{ matrix.format }}
          FULL: ${{ needs.version.outputs.version }}-r1
        run: |
          cid=$(docker create "lst-signbox-lists-tgbot-${FORMAT}:${ARCH}")
          out="dist/${FORMAT}/${ARCH}"
          rm -rf "$out"
          mkdir -p "$out" /tmp/pkg-extract
          docker cp "$cid:/builder/bin/packages/." /tmp/pkg-extract/
          docker rm "$cid"
          if [ "$FORMAT" = ipk ]; then
            find /tmp/pkg-extract -name 'lst-signbox-lists-tgbot_*.ipk' -exec cp -f {} "$out/" \;
            find /tmp/pkg-extract -name 'luci-app-lst-signbox-lists-tgbot_*.ipk' -exec cp -f {} "$out/" \;
          else
            # apk names carry no architecture: rename them the ipk way so the
            # release assets of different architectures do not collide.
            cp -f "$(find /tmp/pkg-extract -name "lst-signbox-lists-tgbot-${FULL}.apk" -print -quit)" \
              "$out/lst-signbox-lists-tgbot_${FULL}_${ARCH}.apk"
            cp -f "$(find /tmp/pkg-extract -name "luci-app-lst-signbox-lists-tgbot-${FULL}.apk" -print -quit)" \
              "$out/luci-app-lst-signbox-lists-tgbot_${FULL}_all.apk"
          fi
          ls -la "$out/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.format }}-${{ matrix.arch }}
          path: dist/${{ matrix.format }}/${{ matrix.arch }}/*.${{ matrix.format }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Unlike test/build, this pushes a git tag and publishes a release — not
    # safe to cancel mid-flight. Queue instead: in practice a stale run can't
    # even get here, since its build job was already cancelled above.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The luci package is arch-independent and has the same name in every
      # architecture's artifact, so each format is merged into its own folder.
      - name: Download IPK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          path: release/ipk
          merge-multiple: true

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: release/apk
          merge-multiple: true

      - name: Show release files
        run: find release \( -name '*.ipk' -o -name '*.apk' \) | sort

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "Release ${{ needs.version.outputs.version }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.version }}
          files: |
            release/ipk/*.ipk
            release/apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true

  commit-dist:
    name: Update dist in repo
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Same reasoning as release: this commits and pushes to main directly,
    # so queue rather than cancel.
    concurrency:
      group: commit-dist-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download IPK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          path: artifacts
          merge-multiple: false

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: artifacts
          merge-multiple: false

      - name: Layout dist
        run: |
          rm -rf dist/ipk/*/ dist/apk/*/
          for format in ipk apk; do
            for arch in aarch64_cortex-a53 aarch64_generic arm_cortex-a7_neon-vfpv4 mipsel_24kc x86_64; do
              mkdir -p "dist/${format}/${arch}"
              [ -d "artifacts/${format}-${arch}" ] && cp -f artifacts/${format}-${arch}/*.${format} "dist/${format}/${arch}/" || true
            done
          done
          find dist \( -name '*.ipk' -o -name '*.apk' \) | sort

      - name: Update manifest
        run: |
          python3 scripts/update-manifest.py "${{ needs.version.outputs.version }}" 1 dist/manifest.json

      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update packages ${{ needs.version.outputs.version }}"
          # The concurrency group above should prevent overlapping runs from
          # racing on this push, but rebase-and-retry once in case main moved
          # for an unrelated reason (e.g. a manual commit) between checkout
          # and push.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt ${attempt}), rebasing onto latest main"
            git fetch origin main
            git rebase origin/main
          done
          echo "push failed after retries" >&2
          exit 1
