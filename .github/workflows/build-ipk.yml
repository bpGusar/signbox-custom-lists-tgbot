name: Build IPK packages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          chmod +x scripts/version.sh
          V="$(./scripts/version.sh)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Package version: $V"

  build:
    name: ${{ matrix.arch }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - arm_cortex-a7_neon-vfpv4
          - mipsel_24kc
          - x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Build IPK (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-ipk
          tags: lists-tg-ipk:${{ matrix.arch }}
          build-args: |
            ARCH=${{ matrix.arch }}
            OPENWRT_VERSION=24.10.5
            LISTS_TG_VERSION=${{ needs.version.outputs.version }}
            LISTS_TG_RELEASE=1
          load: true

      - name: Extract IPK files
        run: |
          cid=$(docker create lists-tg-ipk:${{ matrix.arch }})
          mkdir -p "dist/ipk/${{ matrix.arch }}" /tmp/ipk-extract
          docker cp "$cid:/builder/bin/packages/." /tmp/ipk-extract/
          docker rm "$cid"
          find /tmp/ipk-extract -name 'lists-tg_*.ipk' -exec cp -f {} "dist/ipk/${{ matrix.arch }}/" \;
          find /tmp/ipk-extract -name 'luci-app-lists-tg_*.ipk' -exec cp -f {} "dist/ipk/${{ matrix.arch }}/" \;
          ls -la "dist/ipk/${{ matrix.arch }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.arch }}
          path: dist/ipk/${{ matrix.arch }}/*.ipk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download IPK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          path: release
          merge-multiple: true

      - name: Show release files
        run: find release -name '*.ipk' | sort

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "Release ${{ needs.version.outputs.version }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.version }}
          files: release/**/*.ipk
          draft: false
          prerelease: false
          generate_release_notes: true

  commit-dist:
    name: Update dist/ipk in repo
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download IPK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          path: artifacts
          merge-multiple: false

      - name: Layout dist/ipk
        run: |
          rm -rf dist/ipk/*/
          for arch in aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4 mipsel_24kc x86_64; do
            mkdir -p "dist/ipk/${arch}"
            [ -d "artifacts/ipk-${arch}" ] && cp -f artifacts/ipk-${arch}/*.ipk "dist/ipk/${arch}/" || true
          done
          find dist/ipk -name '*.ipk' | sort

      - name: Update manifest
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          python3 - "$VERSION" dist/manifest.json <<'PY'
import json, sys
version, path = sys.argv[1], sys.argv[2]
with open(path) as f:
    data = json.load(f)
data["version"] = f"{version}-r1"
data["packages"]["lists-tg"] = f"lists-tg_{version}-r1_${{ARCH}}.ipk"
data["packages"]["luci-app-lists-tg"] = f"luci-app-lists-tg_{version}-r1_all.ipk"
with open(path, "w") as f:
    json.dump(data, f, indent=2)
    f.write("\n")
PY

      - name: Commit dist/ipk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update IPK packages ${{ needs.version.outputs.version }}"
          git push
