name: Build IPK packages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A newer commit's test run supersedes an older one outright — cancel it,
    # nothing here touches shared state so there's nothing to leave half-done.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          chmod +x scripts/version.sh
          V="$(./scripts/version.sh)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Package version: $V"

  build:
    name: ${{ matrix.arch }}
    needs: [test, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same reasoning as the test job: this is the expensive, multi-arch stage,
    # and cancelling it for a stale commit is pure savings — release/commit-dist
    # both require build to succeed, so cancelling it here also stops the old
    # run from ever reaching the git-push stage below.
    # Group is per-arch: matrix legs of the *same* run must stay parallel,
    # only the same leg across two different runs should race/cancel.
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - arm_cortex-a7_neon-vfpv4
          - mipsel_24kc
          - x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build IPK (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-ipk
          tags: lst-signbox-lists-tgbot-ipk:${{ matrix.arch }}
          build-args: |
            ARCH=${{ matrix.arch }}
            OPENWRT_VERSION=24.10.5
            LISTS_TG_VERSION=${{ needs.version.outputs.version }}
            LISTS_TG_RELEASE=1
          load: true
          cache-from: type=gha,scope=ipk-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ipk-${{ matrix.arch }}

      - name: Extract IPK files
        run: |
          cid=$(docker create lst-signbox-lists-tgbot-ipk:${{ matrix.arch }})
          rm -rf "dist/ipk/${{ matrix.arch }}"
          mkdir -p "dist/ipk/${{ matrix.arch }}" /tmp/ipk-extract
          docker cp "$cid:/builder/bin/packages/." /tmp/ipk-extract/
          docker rm "$cid"
          find /tmp/ipk-extract -name 'lst-signbox-lists-tgbot_*.ipk' -exec cp -f {} "dist/ipk/${{ matrix.arch }}/" \;
          find /tmp/ipk-extract -name 'luci-app-lst-signbox-lists-tgbot_*.ipk' -exec cp -f {} "dist/ipk/${{ matrix.arch }}/" \;
          ls -la "dist/ipk/${{ matrix.arch }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.arch }}
          path: dist/ipk/${{ matrix.arch }}/*.ipk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Unlike test/build, this pushes a git tag and publishes a release — not
    # safe to cancel mid-flight. Queue instead: in practice a stale run can't
    # even get here, since its build job was already cancelled above.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download IPK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          path: release
          merge-multiple: true

      - name: Show release files
        run: find release -name '*.ipk' | sort

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "Release ${{ needs.version.outputs.version }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.version }}
          files: release/**/*.ipk
          draft: false
          prerelease: false
          generate_release_notes: true

  commit-dist:
    name: Update dist/ipk in repo
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Same reasoning as release: this commits and pushes to main directly,
    # so queue rather than cancel.
    concurrency:
      group: commit-dist-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download IPK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          path: artifacts
          merge-multiple: false

      - name: Layout dist/ipk
        run: |
          rm -rf dist/ipk/*/
          for arch in aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4 mipsel_24kc x86_64; do
            mkdir -p "dist/ipk/${arch}"
            [ -d "artifacts/ipk-${arch}" ] && cp -f artifacts/ipk-${arch}/*.ipk "dist/ipk/${arch}/" || true
          done
          find dist/ipk -name '*.ipk' | sort

      - name: Update manifest
        run: |
          python3 scripts/update-manifest.py "${{ needs.version.outputs.version }}" 1 dist/manifest.json

      - name: Commit dist/ipk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update IPK packages ${{ needs.version.outputs.version }}"
          # The concurrency group above should prevent overlapping runs from
          # racing on this push, but rebase-and-retry once in case main moved
          # for an unrelated reason (e.g. a manual commit) between checkout
          # and push.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt ${attempt}), rebasing onto latest main"
            git fetch origin main
            git rebase origin/main
          done
          echo "push failed after retries" >&2
          exit 1
